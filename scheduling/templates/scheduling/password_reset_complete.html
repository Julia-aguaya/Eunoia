{% extends "scheduling/auth_base.html" %}

{% block title %}Contraseña actualizada | Eunoia{% endblock %}
{% block extra_head %}
    <style>
        .auth-layout {
            grid-template-columns: minmax(0, 440px);
            justify-content: center;
        }

        .auth-panel {
            display: none;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
    </style>
{% endblock %}
{% block auth_body %}
    <div class="auth-header"><h1>¡Listo!</h1></div>
    <p class="auth-copy">Tu contraseña fue actualizada.</p>
    <div class="auth-actions"><a class="button" href="{% url 'login' %}">Ingresar</a></div>
{% endblock %}
