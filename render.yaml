services:
  - type: web
    name: eunoia
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_DB_CHARSET
        value: utf8mb4
      - key: DJANGO_DB_SQL_MODE
        value: STRICT_TRANS_TABLES
      - key: DJANGO_DB_CONNECT_TIMEOUT
        value: "5"
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "60"
      - key: DJANGO_DB_CONN_HEALTH_CHECKS
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_DB_SSL_CA
        sync: false
      - key: DJANGO_DB_SSL_CERT
        sync: false
      - key: DJANGO_DB_SSL_KEY
        sync: false
      - key: EUNOIA_DEFAULT_TEMPORARY_PASSWORD
        sync: false
      - key: EUNOIA_ADMIN_EMAIL
        sync: false
      - key: EUNOIA_ADMIN_PASSWORD
        sync: false
  - type: cron
    name: eunoia-fixed-booking-maintenance
    runtime: python
    plan: starter
    # Render evaluates cron schedules in UTC: Saturday 03:05 UTC is 00:05 ART.
    schedule: '5 3 * * 6'
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py maintain_fixed_booking_horizon
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DEBUG
      - key: DJANGO_USE_SQLITE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_USE_SQLITE
      - key: DATABASE_URL
        fromService:
          name: eunoia
          type: web
          envVarKey: DATABASE_URL
      - key: DJANGO_DB_CHARSET
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CHARSET
      - key: DJANGO_DB_SQL_MODE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SQL_MODE
      - key: DJANGO_DB_CONNECT_TIMEOUT
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONNECT_TIMEOUT
      - key: DJANGO_DB_CONN_MAX_AGE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONN_MAX_AGE
      - key: DJANGO_DB_CONN_HEALTH_CHECKS
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONN_HEALTH_CHECKS
      - key: DJANGO_DB_SSL_CA
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_CA
      - key: DJANGO_DB_SSL_CERT
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_CERT
      - key: DJANGO_DB_SSL_KEY
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_KEY
      - key: EUNOIA_FIXED_BOOKING_HORIZON_DAYS
        value: "42"
  - type: cron
    name: eunoia-fixed-booking-maintenance-daily
    runtime: python
    plan: starter
    # Render evaluates cron schedules in UTC: 03:15 UTC is 00:15 ART.
    schedule: '15 3 * * *'
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py maintain_fixed_booking_horizon
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DEBUG
      - key: DJANGO_USE_SQLITE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_USE_SQLITE
      - key: DATABASE_URL
        fromService:
          name: eunoia
          type: web
          envVarKey: DATABASE_URL
      - key: DJANGO_DB_CHARSET
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CHARSET
      - key: DJANGO_DB_SQL_MODE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SQL_MODE
      - key: DJANGO_DB_CONNECT_TIMEOUT
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONNECT_TIMEOUT
      - key: DJANGO_DB_CONN_MAX_AGE
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONN_MAX_AGE
      - key: DJANGO_DB_CONN_HEALTH_CHECKS
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_CONN_HEALTH_CHECKS
      - key: DJANGO_DB_SSL_CA
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_CA
      - key: DJANGO_DB_SSL_CERT
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_CERT
      - key: DJANGO_DB_SSL_KEY
        fromService:
          name: eunoia
          type: web
          envVarKey: DJANGO_DB_SSL_KEY
      - key: EUNOIA_FIXED_BOOKING_HORIZON_DAYS
        value: "42"
